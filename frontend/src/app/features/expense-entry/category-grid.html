<div class="grid" role="group" aria-label="Category">
  @for (c of categories(); track c.id) {
    <button
      type="button"
      class="cat"
      [class.selected]="c.id === selectedId()"
      [attr.aria-pressed]="selectedId() === undefined ? null : c.id === selectedId()"
      [class.is-disabled]="disabled()"
      [attr.aria-disabled]="disabled() || null"
      [class.frozen]="isFrozen(c)"
      (click)="picked.emit(c.id)"
    >
      @if (isFrozen(c)) {
        <svg class="snow" viewBox="0 0 24 24" width="14" height="14" aria-label="Frozen" role="img">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            d="M12 2v20M3.3 7l17.4 10M3.3 17l17.4-10M9 4l3 2 3-2M9 20l3-2 3 2"
          />
        </svg>
      }
      {{ c.name }}
    </button>
  } @empty {
    <p class="none">No categories</p>
  }
</div>
