<main class="entry" aria-label="New expense">
  <header class="bar">
    <button type="button" class="close" data-testid="close-entry" aria-label="Close" (click)="close()">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
      </svg>
    </button>
    <app-date-chip [date]="selectedDate()" [today]="today()" (dateChange)="onDatePicked($event)" />
  </header>

  <div class="amount">
    <app-amount-display [amount]="amount()" />
  </div>

  <div class="categories" data-testid="categories">
    <app-category-grid [categories]="categories()" [disabled]="!canSave()" (picked)="onCategory($event)" />
  </div>

  <app-keypad (press)="onKey($event)" />
</main>
