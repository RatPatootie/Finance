<section [attr.aria-labelledby]="headingId">
  <header class="head">
    <h2 [id]="headingId">{{ heading() }}</h2>
    @if (showTotal()) {
      <span class="total" data-testid="today-total">{{ money(total()) }}</span>
    }
  </header>

  @if (expenses().length === 0) {
    <p class="empty" data-testid="today-empty">{{ emptyText() }}</p>
  } @else {
    <ul class="list">
      @for (e of visible(); track e.id) {
        <li class="row" data-testid="expense-row" [attr.data-kind]="kind(e)" [class.aside]="kind(e) !== 'spend'">
          <button type="button" class="main" (click)="edit.emit(e)" [attr.aria-label]="'Edit ' + categoryName(e) + ' ' + money(e.amountKopecks)">
            <span class="cat">
              @if (kind(e) !== 'spend') {
                <svg class="snow" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    d="M12 2v20M3.3 7l17.4 10M3.3 17l17.4-10M9 4l3 2 3-2M9 20l3-2 3 2"
                  />
                </svg>
              }
              {{ categoryName(e) }}
              @if (kind(e) === 'freeze') {
                <span class="mark">· Frozen</span>
              } @else if (kind(e) === 'return') {
                <span class="mark">· Returned</span>
              }
            </span>
            <span class="time">{{ time(e.createdAt) }}</span>
            <span class="amt">{{ kind(e) === 'return' ? '−' : '' }}{{ money(e.amountKopecks) }}</span>
          </button>
          <button type="button" class="del" (click)="remove.emit(e)" [attr.aria-label]="'Delete ' + categoryName(e) + ' ' + money(e.amountKopecks)">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="currentColor" d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5-1-1h-5l-1 1H5v2h14V4h-3.5z" />
            </svg>
          </button>
        </li>
      }
    </ul>
    @if (canToggle()) {
      <button type="button" class="more" data-testid="toggle-all" [attr.aria-expanded]="expanded()" (click)="expanded.set(!expanded())">
        {{ expanded() ? 'Show less' : 'Show all ' + expenses().length }}
      </button>
    }
  }
</section>
