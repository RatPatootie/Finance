<div class="sheet">
  <h2>{{ data.title }}</h2>
  <div class="screen">
    @if (hasOp()) {
      <p class="expr" data-testid="amount" aria-live="polite">{{ pretty() }}</p>
      @if (result(); as r) {
        @if (r.kind === 'error') {
          <p class="preview error" data-testid="calc-error" role="alert">{{ r.message }}</p>
        } @else if (r.kind === 'ok') {
          <p class="preview" data-testid="calc-result">= {{ money(r.kopecks) }}</p>
        }
      }
    } @else {
      <app-amount-display [amount]="expr()" />
    }
  </div>
  <app-keypad [operators]="true" (press)="onKey($event)" (calc)="onKey($event)" />
  <div class="actions">
    <button type="button" class="btn text" data-testid="cancel-amount" (click)="cancel()">Cancel</button>
    <button type="button" class="btn filled" data-testid="save-amount" [disabled]="!canSave()" (click)="save()">Save</button>
  </div>
</div>
