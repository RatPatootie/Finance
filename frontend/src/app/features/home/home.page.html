<main class="page">
  <button type="button" class="gear" data-testid="open-settings" aria-label="Settings" (click)="openSettings()">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
      />
    </svg>
  </button>

  <section class="summary" aria-label="Budget">
    @if (budget(); as b) {
      <p class="label">Balance</p>
      <p class="figure" data-testid="hero-balance">{{ money(shownBalance()) }}</p>
      @if (b.left !== null && b.status !== null) {
        <p class="left" [class]="'status-' + b.status" data-testid="hero-left" [attr.data-status]="b.status">
          <span class="dot" aria-hidden="true"></span>
          @if (b.left >= 0) {
            <span><strong>{{ money(b.left) }}</strong> left today</span>
          } @else {
            <span><strong>{{ money(-b.left) }}</strong> over today</span>
          }
        </p>
        <div class="usage" [class]="'status-' + b.status" data-testid="usage">
          <div
            class="track"
            role="progressbar"
            [attr.aria-label]="money(b.spentToday) + ' of ' + money(b.limit ?? 0) + ' used today'"
            aria-valuemin="0"
            aria-valuemax="100"
            [attr.aria-valuenow]="usedPercent()"
          >
            <div class="fill" data-testid="usage-fill" [style.width.%]="usedPercent()"></div>
          </div>        </div>
      } @else {
        <button type="button" class="share-prompt" data-testid="setup-share" (click)="openSettings()">
          Set your daily share of income to see what's left today
        </button>
      }
    } @else if (budget() === null) {
      <button type="button" class="setup" data-testid="setup-balance" (click)="openSettings()">
        <span class="setup-title">Set your balance</span>
        <span class="setup-text">to see how much you can spend today</span>
      </button>
    }
  </section>

  <div class="add-row">
    <button type="button" class="add" data-testid="add-expense" aria-label="Add expense" (click)="add()">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
          d="M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L6 21z"
        />
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M9 8h6M9 12h6M9 16h3" />
      </svg>
    </button>
  </div>

  <app-week-strip class="week" [selected]="day()" (selectedChange)="pickDay($event)" />

  <app-today-list
    class="today"
    [heading]="listHeading()"
    [emptyText]="emptyText()"
    [expenses]="dayExpenses()"
    [total]="dayTotal()"
    [limit]="3"
    (edit)="onEdit($event)"
    (remove)="onDelete($event)"
  />
</main>
